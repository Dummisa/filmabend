# Veröffentlicht den Ordner docs/ als statische Seite auf GitHub Pages –
# ohne Jekyll (gleiches Vorgehen wie beim TOTO-Dashboard).
#
# Einmalig im Repo: Settings → Pages → Source: "GitHub Actions"
# Danach löst jeder Push automatisch ein Deployment aus.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Versionsstempel: alle Dateien einer Version gehören zusammen
      # (verhindert, dass der Browser nach einem Update alte und neue Dateien mischt)
      - name: Stamp version
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" docs/index.html docs/*.js

      - name: Upload docs folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
